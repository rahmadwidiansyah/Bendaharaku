name: bendaharaku

services:

  # ────────────────────────────────────────────────────────────────
  # Utility
  # ────────────────────────────────────────────────────────────────
  node:
    image: node:20-alpine
    container_name: bendaharaku_node
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    entrypoint: ["npm"]

  # ────────────────────────────────────────────────────────────────
  # Database
  # ────────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: bendaharaku_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-sail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - laravel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sail} -d ${DB_DATABASE:-laravel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ────────────────────────────────────────────────────────────────
  # Laravel App (PHP + Apache) — self-contained image
  # ────────────────────────────────────────────────────────────────
  app:
    build: .
    image: bendaharaku:latest
    container_name: bendaharaku_app
    restart: always
    command: ["apache-only"]
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
    networks:
      - laravel
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ────────────────────────────────────────────────────────────────
  # Nginx
  # ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bendaharaku_nginx
    restart: always
    ports:
      - "4000:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - laravel

  # ────────────────────────────────────────────────────────────────
  # AI Parser (Python FastAPI) — from the SAME image
  # ────────────────────────────────────────────────────────────────
  ai-parser:
    image: bendaharaku:latest
    container_name: bendaharaku_ai_parser
    hostname: ai-parser
    restart: unless-stopped
    command: ["ai-parser"]
    expose:
      - "3987"
    networks:
      - laravel
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3987/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ────────────────────────────────────────────────────────────────
  # OCR Service (Python FastAPI)
  # ────────────────────────────────────────────────────────────────
  ocr-service:
    build: ./ocr-service
    image: bendaharaku-ocr-service
    container_name: bendaharaku_ocr
    hostname: ocr-service
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - laravel
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

networks:
  laravel:
    driver: bridge

volumes:
  db_data:
