name: Scheduled Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bendaharaku

jobs:
  prune-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          min-versions-to-keep: 10
          delete-only-preview-versions: true
          package-type: container
          token: ${{ secrets.GITHUB_TOKEN }}
