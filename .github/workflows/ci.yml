name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bendaharaku

jobs:
  # ──────────────────────────────────────────────────────────────────
  # 1. LINT
  # ──────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist

      - name: Laravel Pint
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS deps
        run: npm ci

      - name: ESLint
        run: npx eslint resources/js/ --max-warnings=0
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # 2. LARAVEL TESTS
  # ──────────────────────────────────────────────────────────────────
  laravel-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install deps
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run PHPUnit
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test --without-tty
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # 3. PYTHON TESTS
  # ──────────────────────────────────────────────────────────────────
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: script_pencatat_keuangan

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: script_pencatat_keuangan/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx pytest

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  # ──────────────────────────────────────────────────────────────────
  # 4. INTEGRATION TEST — Laravel ↔ AI Parser
  # ──────────────────────────────────────────────────────────────────
  integration:
    needs: [python-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: script_pencatat_keuangan/requirements.txt

      - name: Install Python deps
        run: pip install -r script_pencatat_keuangan/requirements.txt httpx

      - name: Start AI Parser
        run: |
          cd script_pencatat_keuangan
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 3987 &
          echo "PID=$!"
          # Tunggu service siap
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3987/ready > /dev/null 2>&1; then
              echo "AI Parser ready"
              break
            fi
            echo "Waiting... ($i/10)"
            sleep 1
          done

      - name: Health check
        run: |
          curl -sf http://localhost:3987/health && echo " OK"
          curl -sf http://localhost:3987/live && echo " OK"
          curl -sf http://localhost:3987/ready && echo " OK"

      - name: Analyze transaction (via HTTP)
        run: |
          curl -sf -X POST http://localhost:3987/analyze \
            -H "Content-Type: application/json" \
            -d '{
              "text": "beli nasi goreng 25rb",
              "wallets": [],
              "categories": [{"category_name": "Makanan", "keyword": "makan,nasi,goreng"}]
            }' | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['success'] == True
          assert data['amount'] == 25000.0
          assert data['category'] == 'Makanan'
          assert data['transaction_type'] == 'expense'
          print('✅ Analyze: OK (amount=%.0f, cat=%s)' % (data['amount'], data['category']))
          "

      - name: Analyze transfer
        run: |
          curl -sf -X POST http://localhost:3987/analyze \
            -H "Content-Type: application/json" \
            -d '{
              "text": "transfer 50rb dari bca ke gopay",
              "wallets": [
                {"name": "BCA", "group_type": "Liquid", "keyword": "bca"},
                {"name": "GoPay", "group_type": "Liquid", "keyword": "gopay"}
              ],
              "categories": [{"category_name": "Transfer", "keyword": "transfer"}]
            }' | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['success'] == True
          assert data['amount'] == 50000.0
          assert data['source_wallet'] == 'BCA'
          assert data['destination_wallet'] == 'GoPay'
          assert data['is_cleared'] == True
          print('✅ Transfer: OK (%.0f, %s → %s)' % (data['amount'], data['source_wallet'], data['destination_wallet']))
          "

      - name: Analyze hutang
        run: |
          curl -sf -X POST http://localhost:3987/analyze \
            -H "Content-Type: application/json" \
            -d '{
              "text": "pinjam 100rb dari budi #hutang",
              "wallets": [{"name": "Cash", "group_type": "Liquid", "keyword": "cash"}],
              "categories": [{"category_name": "Hutang", "keyword": "hutang"}]
            }' | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['success'] == True
          assert data['transaction_type'] == 'debt'
          assert data['subject'] == 'hutang'
          print('✅ Hutang: OK (type=%s, subject=%s)' % (data['transaction_type'], data['subject']))
          "

      - name: Analyze income
        run: |
          curl -sf -X POST http://localhost:3987/analyze \
            -H "Content-Type: application/json" \
            -d '{
              "text": "gaji 5jt",
              "wallets": [{"name": "BCA", "group_type": "Liquid", "keyword": "bca"}],
              "categories": [{"category_name": "Gaji", "keyword": "gaji"}]
            }' | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['success'] == True
          assert data['transaction_type'] == 'income'
          assert data['amount'] == 5000000.0
          print('✅ Income: OK (%.0f, type=%s)' % (data['amount'], data['transaction_type']))
          "

      - name: No API key required
        run: |
          curl -sf -X POST http://localhost:3987/analyze \
            -H "Content-Type: application/json" \
            -d '{"text": "beli kopi 10rb", "wallets": [], "categories": []}' \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          assert data['success'] == True
          print('✅ No auth: OK (access granted without API key)')
          "

      - name: Stop AI Parser
        if: always()
        run: pkill -f "uvicorn app.main:app" || true

  # ──────────────────────────────────────────────────────────────────
  # 5. DOCKER BUILD & PUBLISH — single image
  # ──────────────────────────────────────────────────────────────────
  docker:
    needs: [python-tests, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────
  # 6. DEPLOY — Trigger n8n (single image)
  # ──────────────────────────────────────────────────────────────────
  deploy:
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger n8n deployment
        run: |
          curl -sS -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Content-Type: application/json" \
            -d '{
              "repository": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
            }'
