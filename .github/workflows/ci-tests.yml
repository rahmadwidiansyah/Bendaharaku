name: CI - Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (production stable)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_pgsql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Debug - System information
        run: |
          echo "=== PHP Version ===" && php --version
          echo "=== Composer Version ===" && composer --version
          echo "=== PostgreSQL Client ===" && psql --version
          echo "=== pg_isready ===" && pg_isready --version

      - name: Setup .env for testing
        run: |
          # Copy template
          cp .env.example .env
          
          # Force testing environment
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          
          # Use localhost for GitHub Actions (service port is mapped to host)
          grep -q "^DB_HOST=" .env || echo "DB_HOST=localhost" >> .env
          sed -i 's/^DB_HOST=.*/DB_HOST=localhost/' .env
          
          # Ensure other DB configuration is set
          grep -q "^DB_PORT=" .env || echo "DB_PORT=5432" >> .env
          grep -q "^DB_DATABASE=" .env || echo "DB_DATABASE=testing" >> .env
          grep -q "^DB_USERNAME=" .env || echo "DB_USERNAME=postgres" >> .env
          grep -q "^DB_PASSWORD=" .env || echo "DB_PASSWORD=postgres" >> .env
          
          # Verify configuration
          echo "=== Generated .env DB Configuration ===" && grep "^DB_" .env

      - name: Generate APP_KEY
        run: php artisan key:generate --force

      - name: Clear configuration cache (fresh start)
        run: php artisan config:clear

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL server..."
          max_retries=30
          retry=0
          
          # Wait for server to respond (use localhost since port is mapped to host)
          until pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1 || [ $retry -ge $max_retries ]; do
            retry=$((retry + 1))
            echo "PostgreSQL not ready ($retry/$max_retries), waiting..."
            sleep 2
          done
          
          if [ $retry -ge $max_retries ]; then
            echo "ERROR: PostgreSQL failed to become ready after $((max_retries * 2)) seconds"
            echo "=== Port check ===" && (ss -ltn | grep 5432 || echo "port not listening")
            echo "=== Try connecting ===" && (psql -h localhost -U postgres -d postgres -c "SELECT 1" 2>&1 || echo "connection failed")
            exit 1
          fi
          
          echo "✓ PostgreSQL server is ready"

      - name: Run database migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          echo "Running migrations..."
          php artisan migrate --force --verbose
          echo "✓ Migrations completed successfully"

      - name: List available test suites
        run: php artisan test --list

      - name: Run Feature tests (single-process mode)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          echo "Running Feature tests..."
          php artisan test --testsuite=Feature --stop-on-failure
          echo "✓ Feature tests passed"

      - name: Run Unit tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          echo "Running Unit tests..."
          php artisan test --testsuite=Unit --stop-on-failure
          echo "✓ Unit tests passed"

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest (if configured)
        run: |
          if grep -q '"vitest"' package.json; then
            echo "Running Vitest..."
            npm run test:unit
            echo "✓ Vitest tests passed"
          else
            echo "ℹ Vitest not configured, skipping"
          fi
