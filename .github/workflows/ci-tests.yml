name: CI - Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  php-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_pgsql

      - name: Install composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: |
          cp .env.example .env
          # Ensure DB_* variables present and point to the postgres service
          cat >> .env <<'ENV'
DB_CONNECTION=pgsql
DB_HOST=postgres
DB_PORT=5432
DB_DATABASE=testing
DB_USERNAME=postgres
DB_PASSWORD=postgres
ENV

      - name: Install postgres client for pg_isready and psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Debug: DNS and binaries
        run: |
          echo "--- getent hosts postgres ---"; getent hosts postgres || true
          echo "--- which pg_isready ---"; which pg_isready || true
          echo "--- pg_isready --version (if available) ---"; pg_isready --version || true
          echo "--- psql --version ---"; psql --version || true
          echo "--- DB env vars in .env ---"; grep -E '^DB_' .env || true

      - name: Wait for Postgres (with timeout)
        run: |
          set -eu
          max_retries=30
          count=0
          until pg_isready -h postgres -p 5432 -U postgres -d testing >/dev/null 2>&1; do
            count=$((count+1))
            echo "Waiting for postgres... ($count/$max_retries)"
            if [ "$count" -ge "$max_retries" ]; then
              echo "Postgres did not become available in time"
              # debug again
              echo "--- docker service hosts ---"
              getent hosts postgres || true
              echo "--- netstat (if available) ---"
              ss -ltn || true
              exit 1
            fi
            sleep 2
          done
          echo "Postgres is ready"

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: postgres
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: |
          php artisan migrate --force

      - name: Run tests (targeted)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: postgres
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test --parallel --testsuite=Feature

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend deps
        run: |
          cd resources/js || exit 0
          npm ci
      - name: Run vitest if available
        run: |
          if [ -f package.json ] && grep -q vitest package.json; then
            npm run test:unit || true
          else
            echo "No vitest tests found"
          fi
