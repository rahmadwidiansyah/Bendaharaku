name: APK (TWA)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Raw icon allows PR builds; main/tag builds use prod icons after deploy
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Restore keystore (if secrets present)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "✅ Keystore restored ($(wc -c < release.keystore) bytes)"
            keytool -list -v -keystore release.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>&1 | head -n 20 || true
          else
            echo "⚠️  ANDROID_KEYSTORE_BASE64 not set — will build debug APK only"
          fi

      - name: Bump TWA version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "Version: $VERSION_NAME code: $GITHUB_RUN_NUMBER"
          node scripts/bump-twa-version.js --code "$GITHUB_RUN_NUMBER" --name "$VERSION_NAME"
          cat twa-manifest.json

      - name: Validate PWA manifest (optional)
        run: |
          echo "Checking public/manifest.json..."
          cat public/manifest.json | head -n 30
          echo "Checking icons with padding..."
          ls -lh public/icons/ || true

      - name: Validate TWA manifest
        run: |
          set -e
          echo "🔍 Validating twa-manifest.json URLs (no secrets printed)..."
          node scripts/validate-twa-manifest.js twa-manifest.json
          echo "🔍 Also validating public/manifest.json..."
          node -e "
            const m=require('./public/manifest.json');
            console.log('public/manifest start_url:', m.start_url, 'scope:', m.scope);
            if (!m.start_url || !m.scope) { console.error('❌ public/manifest missing start_url/scope'); process.exit(1); }
            console.log('✅ public/manifest.json looks ok');
          "
          echo "✅ All manifest validation passed"

      - name: Build TWA (APK)
        env:
          # Bubblewrap reads these for non-interactive password handling (see Build.getPasswords)
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Keep ANDROID_ vars for keytool verification and backward compat
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          TWA_DIR="twa"
          mkdir -p "$TWA_DIR"
          if [ -f release.keystore ]; then cp release.keystore "$TWA_DIR/release.keystore"; fi
          # Sync bumped manifest to TWA dir and fix signing path
          cp twa-manifest.json "$TWA_DIR/twa-manifest.json"
          if command -v jq >/dev/null 2>&1; then
            jq '.signingKey.path="./release.keystore"' "$TWA_DIR/twa-manifest.json" > /tmp/twa.json && mv /tmp/twa.json "$TWA_DIR/twa-manifest.json"
          fi
          echo "📄 TWA manifest to be used:"
          cat "$TWA_DIR/twa-manifest.json"
          # Validate the synced manifest as well (ensures URLs still absolute after jq)
          node scripts/validate-twa-manifest.js "$TWA_DIR/twa-manifest.json"
          # Pre-configure Bubblewrap JDK + Android SDK (non-interactive, no prompt)
          mkdir -p ~/.bubblewrap
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_PATH" ] || [ ! -d "$SDK_PATH" ]; then SDK_PATH="/usr/local/lib/android/sdk"; fi
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK_PATH" > ~/.bubblewrap/config.json
          echo "Bubblewrap config:"
          cat ~/.bubblewrap/config.json
          bubblewrap doctor 2>&1 | head -n 30 || true
          # Generate checksum so build doesn't prompt "No checksum file..."
          # (build checks twa/manifest-checksum.txt vs current manifest)
          node -e "
            const fs=require('fs'), crypto=require('crypto'), path=require('path');
            const manifestPath=path.join('$TWA_DIR','twa-manifest.json');
            const checksumPath=path.join('$TWA_DIR','manifest-checksum.txt');
            const data=fs.readFileSync(manifestPath);
            const sum=crypto.createHash('sha1').update(data).digest('hex');
            fs.writeFileSync(checksumPath, sum);
            console.log('Generated checksum:', sum);
          "
          ls -lh "$TWA_DIR"/manifest-checksum.txt || true
          # If TWA project not yet initialized (no app/build.gradle), init it non-interactively
          if [ ! -f "$TWA_DIR/app/build.gradle" ]; then
            echo "Initializing TWA project (non-interactive)..."
            # Validate again before init — fail fast on Invalid URL
            node scripts/validate-twa-manifest.js "$TWA_DIR/twa-manifest.json"
            # Use our non-interactive generator instead of `bubblewrap init` which requires web URL + prompts
            # This creates Android project + gradlew without needing `bubblewrap init --manifest <URL>`
            export NODE_PATH=$(npm root -g):$NODE_PATH
            node scripts/generate-twa-project.js "$TWA_DIR" "$TWA_DIR/twa-manifest.json"
            if [ ! -f "$TWA_DIR/app/build.gradle" ]; then
              echo "❌ Failed to generate Android project (app/build.gradle missing)"
              ls -la "$TWA_DIR" || true
              exit 1
            fi
            if [ ! -f "$TWA_DIR/gradlew" ]; then
              echo "❌ gradlew not found after project generation"
              ls -la "$TWA_DIR" || true
              exit 1
            fi
            echo "✅ Project initialized successfully"
            ls -lh "$TWA_DIR/gradlew" "$TWA_DIR/app/build.gradle" || true
          else
            echo "✅ TWA project already exists, skipping init"
          fi
          cd "$TWA_DIR"
          # Ensure checksum is up-to-date after init (generate script already does, but re-sync for safety)
          node -e "
            const fs=require('fs'), crypto=require('crypto');
            const p='twa-manifest.json';
            const c='manifest-checksum.txt';
            const sum=crypto.createHash('sha1').update(fs.readFileSync(p)).digest('hex');
            fs.writeFileSync(c, sum);
            console.log('Checksum synced:', sum);
          "
          echo "Current manifest checksum:"
          cat manifest-checksum.txt || true
          if [ -f release.keystore ] && [ -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" ]; then
            echo "🔐 Building signed APK (non-interactive via BUBBLEWRAP env)..."
            bubblewrap build --skipPwaValidation
          else
            echo "🔨 Building unsigned (debug) APK..."
            if command -v jq >/dev/null 2>&1; then
              jq 'del(.signingKey)' twa-manifest.json > /tmp/twa.json && mv /tmp/twa.json twa-manifest.json
              node -e "const fs=require('fs'),c=require('crypto');const p='twa-manifest.json',d='manifest-checksum.txt';fs.writeFileSync(d,c.createHash('sha1').update(fs.readFileSync(p)).digest('hex')); console.log('Regenerated checksum for unsigned:', fs.readFileSync(d,'utf8'))"
            fi
            bubblewrap build --skipPwaValidation
          fi
          echo "=== Build outputs ==="
          ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/ 2>&1 | head -n 50 || true
          find . -name "*.apk" -type f | head -n 20
          cd ..

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bendaharaku-apk-${{ github.run_number }}
          path: |
            twa/app/build/outputs/apk/**/*.apk
            twa/app/build/outputs/bundle/**/*.aab
            twa/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            twa/app/build/outputs/apk/**/*.apk
            twa/app/build/outputs/bundle/**/*.aab
          generate_release_notes: true
