name: APK (TWA)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli

      - name: Restore keystore (if secrets present)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "✅ Keystore restored ($(wc -c < release.keystore) bytes)"
            keytool -list -v -keystore release.keystore -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>&1 | head -n 20 || true
          else
            echo "⚠️  ANDROID_KEYSTORE_BASE64 not set — will build debug APK only"
          fi

      - name: Bump TWA version
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "Version: $VERSION_NAME code: $GITHUB_RUN_NUMBER"
          node scripts/bump-twa-version.js --code "$GITHUB_RUN_NUMBER" --name "$VERSION_NAME"
          cat twa-manifest.json

      - name: Validate PWA manifest (optional)
        run: |
          echo "Checking public/manifest.json..."
          cat public/manifest.json | head -n 30
          echo "Checking icons with padding..."
          ls -lh public/icons/ || true

      - name: Build TWA (APK)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          # Bubblewrap project dir is ./twa (avoid colliding with Laravel ./app)
          TWA_DIR="twa"
          mkdir -p "$TWA_DIR"
          # Ensure signingKey path is absolute or relative to TWA dir
          if [ -f release.keystore ]; then cp release.keystore "$TWA_DIR/release.keystore"; fi
          # Init if not exists
          if [ ! -f "$TWA_DIR/twa-manifest.json" ]; then
            cp twa-manifest.json "$TWA_DIR/twa-manifest.json"
            # Adjust signingKey path inside TWA dir
            if command -v jq >/dev/null 2>&1; then
              jq '.signingKey.path="./release.keystore"' "$TWA_DIR/twa-manifest.json" > /tmp/twa.json && mv /tmp/twa.json "$TWA_DIR/twa-manifest.json"
            fi
          else
            # Sync version bump to TWA dir
            cp twa-manifest.json "$TWA_DIR/twa-manifest.json"
          fi
          cd "$TWA_DIR"
          echo "JAVA_HOME=$JAVA_HOME"
          ls -d "$JAVA_HOME" 2>&1 | head
          if [ -f release.keystore ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "🔐 Building signed APK..."
            printf "n\n%s\n" "$JAVA_HOME" | bubblewrap build --skipPwaValidation || (printf "n\n%s\n" "$JAVA_HOME" | bubblewrap update --skipPwaValidation && printf "n\n%s\n" "$JAVA_HOME" | bubblewrap build --skipPwaValidation)
          else
            echo "🔨 Building unsigned (debug) APK..."
            if command -v jq >/dev/null 2>&1; then
              jq 'del(.signingKey)' twa-manifest.json > /tmp/twa.json && mv /tmp/twa.json twa-manifest.json
            fi
            printf "n\n%s\n" "$JAVA_HOME" | bubblewrap build --skipPwaValidation || true
          fi
          ls -lh app/build/outputs/apk/release/ app/build/outputs/bundle/release/ 2>&1 | head -n 50 || true
          find . -name "*.apk" -type f | head -n 20
          cd ..

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bendaharaku-apk-${{ github.run_number }}
          path: |
            twa/app/build/outputs/apk/**/*.apk
            twa/app/build/outputs/bundle/**/*.aab
            twa/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            twa/app/build/outputs/apk/**/*.apk
            twa/app/build/outputs/bundle/**/*.aab
          generate_release_notes: true
